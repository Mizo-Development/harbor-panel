name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harbor
          POSTGRES_PASSWORD: harbor_ci_only
          POSTGRES_DB: harbor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U harbor -d harbor_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://harbor:harbor_ci_only@127.0.0.1:5432/harbor_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Validate shell helpers
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Validate deployment configuration
        env:
          DOMAIN: panel.example.com
          ACME_EMAIL: ops@example.com
          APP_URL: https://panel.example.com
          POSTGRES_PASSWORD: only-a-ci-placeholder
          ENCRYPTION_KEY: only-a-ci-placeholder
          SETUP_TOKEN: only-a-ci-placeholder
        run: docker compose config --quiet
      - name: Build the self-hosted Docker image
        run: docker build --tag harbor:selfhost-check .
