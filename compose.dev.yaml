name: harbor-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
      POSTGRES_DB: harbor
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:6379:6379']
volumes:
  postgres:
